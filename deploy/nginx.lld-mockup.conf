# Nginx site for the proposal mockup at https://lld-mockup.abedubas.dev
#
# Deployed on the shared VPS as /etc/nginx/sites-available/lld-mockup.abedubas.dev,
# symlinked into sites-enabled. That box also serves other clients' sites, so:
#   - The app runs in Docker as "lld-mockup", published on 127.0.0.1:3480 only.
#     Port 3000 is taken there.
#   - Always run `sudo nginx -t`, then `sudo systemctl reload nginx`. Reload, never restart.
#
# Certificate: sudo certbot certonly --nginx -d lld-mockup.abedubas.dev
#   The existing certbot timer renews it.
# Proxy secret: replace CHANGE-ME-proxy-secret with PROXY_SECRET from
#   /opt/lld-mockup/lld-mockup.env. Never commit the real value.

# Rate-limit zones. Ubuntu includes sites-enabled inside http {}, so they can live here.
limit_req_zone $binary_remote_addr zone=lld_contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lld_images:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lld-mockup.abedubas.dev;
    return 301 https://lld-mockup.abedubas.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lld-mockup.abedubas.dev;

    ssl_certificate     /etc/letsencrypt/live/lld-mockup.abedubas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lld-mockup.abedubas.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The mockup stays out of search engines (the app also sends noindex while indexing is off).
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 32k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Overwrite (never append) forwarding headers, and prove requests came through this proxy.
    # A proxy_set_header inside a location block would drop all of these in that location.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-LLD-Proxy       "CHANGE-ME-proxy-secret";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;

    location = /api/contact {
        limit_req zone=lld_contact burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3480;
    }

    location /_next/image {
        limit_req zone=lld_images burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3480;
    }

    location / {
        proxy_pass http://127.0.0.1:3480;
    }
}
