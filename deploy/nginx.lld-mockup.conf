# Nginx for the proposal mockup at https://lld-mockup.abedubas.dev
# 1. DNS: an A record for lld-mockup.abedubas.dev pointing at the VPS.
# 2. Certificate (.dev is HTTPS-only in every browser): sudo certbot --nginx -d lld-mockup.abedubas.dev
# 3. Replace CHANGE-ME-proxy-secret with the same value as PROXY_SECRET in the app env, then:
#    sudo nginx -t && sudo systemctl reload nginx
#
# In the http {} block (for example /etc/nginx/conf.d/lld.conf), once:
# limit_req_zone $binary_remote_addr zone=lld_contact:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=lld_images:10m rate=120r/m;
# server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name lld-mockup.abedubas.dev;
    return 301 https://lld-mockup.abedubas.dev$request_uri;
}

server {
    # nginx older than 1.25.1: use "listen 443 ssl http2;" and drop "http2 on;".
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lld-mockup.abedubas.dev;

    ssl_certificate     /etc/letsencrypt/live/lld-mockup.abedubas.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lld-mockup.abedubas.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The mockup stays out of search engines (the app also sends noindex while indexing is off).
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 32k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Overwrite (never append) forwarding headers; prove requests came through this proxy.
    # Any proxy_set_header inside a location block would drop all of these there.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-LLD-Proxy       "CHANGE-ME-proxy-secret";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;

    location = /api/contact {
        limit_req zone=lld_contact burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location /_next/image {
        limit_req zone=lld_images burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
